name: Check

# Weekly: upstream packages and AI tools release without a repo change.
# A push to main skips the checks when the merged PR was up to date and passed (gpahal/ci).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Actions are pinned to their tag's commit. For an annotated tag, git ls-remote's ^{} line is the commit.

# The event is in the group so the weekly run and a push to main don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# shellcheck is pinned since versions report different warnings. Ubuntu's yq is a different tool,
# and brew's can lag the minimum. A version bump needs new hashes.
env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256_LINUX_X86_64: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  YQ_VERSION: v4.54.1
  YQ_SHA256_DARWIN_ARM64: fee511a181bd8b3e6b7da98842b41973bfac8cd3bcd341ed29a584620b5b2844
  YQ_SHA256_LINUX_AMD64: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f

# Explicit bash adds -eo pipefail, so a failed download in a pipe fails its step
defaults:
  run:
    shell: bash

jobs:
  gate:
    uses: gpahal/ci/.github/workflows/skip-if-tested.yml@ee5b876c99dc4af15f288630704e48421a637716 # v1.1.0
    permissions:
      actions: read
      contents: read
      pull-requests: read

  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      brew: ${{ steps.paths.outputs.brew }}
      ai: ${{ steps.paths.outputs.ai }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        name: Select live compatibility checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          brew=false ai=false
          range="$BASE_SHA..$HEAD_SHA"
          [ "$EVENT" != pull_request ] || range="$BASE_SHA...$HEAD_SHA"
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
              ! git diff --name-only --no-renames "$range" -- > "$RUNNER_TEMP/changed-files"; then
            brew=true ai=true
          else
            while IFS= read -r file; do
              case "$file" in
                .github/* | lib/* | scripts/lib/check.sh) brew=true ai=true ;;
                homebrew/* | scripts/check-brew-packages.sh | scripts/lib/brew.sh) brew=true ;;
                ai_tools/claude-code/* | ai_tools/codex/* | ai_tools/t3-code/* | ai_tools/lib/* | \
                  ai_tools/skills/engineering/interrogate/scripts/run-reviewer.sh | \
                  scripts/check-ai-settings.sh | scripts/check-claude-keys.sh | scripts/check-t3-settings.sh | \
                  scripts/claude-settings-keys.txt | scripts/lib/ai-settings.sh) ai=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          printf 'brew=%s\nai=%s\n' "$brew" "$ai" >> "$GITHUB_OUTPUT"

  # shellcheck is pinned and gives the same result on either OS, so it runs only here.
  lint:
    needs: gate
    if: github.event_name != 'schedule' && needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just jq zsh
          f="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$f" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256_LINUX_X86_64  $f" | sha256sum -c -
          sudo tar -xJ -f "$f" -C /usr/local/bin --strip-components 1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"

      - &install-yq
        name: Install pinned yq
        env:
          YQ_PLATFORM: ${{ runner.os == 'macOS' && 'darwin_arm64' || 'linux_amd64' }}
          YQ_SHA256: ${{ runner.os == 'macOS' && env.YQ_SHA256_DARWIN_ARM64 || env.YQ_SHA256_LINUX_AMD64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-bin"
          f="$RUNNER_TEMP/yq_$YQ_PLATFORM"
          curl -fsSL -o "$f" "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_$YQ_PLATFORM"
          if command -v sha256sum > /dev/null; then sha=(sha256sum); else sha=(shasum -a 256); fi
          echo "$YQ_SHA256  $f" | "${sha[@]}" -c -
          install -m 755 "$f" "$RUNNER_TEMP/ci-bin/yq"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ci-bin/yq" --version

      - name: Check the shellcheck version
        run: |
          shellcheck --version | grep -x "version: ${SHELLCHECK_VERSION#v}"

      - &check-not-root
        name: Check the job isn't root
        run: test "$(id -u)" -ne 0

      # Runs parse too, which on Linux checks only the zsh files
      - run: just check

  # macOS splits its tests across two jobs, and one of them checks the scripts parse under bash 3.2.
  test:
    needs: gate
    if: github.event_name != 'schedule' && needs.gate.outputs.tested != 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, shard: 1/1 }
          - { os: xcode-27, shard: 1/2, parse: true }
          - { os: xcode-27, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install just jq tmux mise git fd lua

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        # sshd -T needs /run/sshd, which ssh.socket creates only on the first connection.
        env:
          MISE_VERSION: v2026.10.5
          MISE_SHA256_LINUX_X64: 8a223b5f8ca71100220a3e5bef259614c348e7b1d80e6b15c2a9c9aa3affe5e4
        run: |
          sudo apt-get update
          sudo apt-get install -y just jq zsh tmux vim fd-find lua5.4 openssh-server
          sudo install -d -m 0755 /run/sshd
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
          f="$RUNNER_TEMP/mise"
          curl -fsSL -o "$f" "https://github.com/jdx/mise/releases/download/$MISE_VERSION/mise-$MISE_VERSION-linux-x64"
          echo "$MISE_SHA256_LINUX_X64  $f" | sha256sum -c -
          sudo install -m 755 "$f" /usr/local/bin/mise

      - *install-yq

      # The runner has classic sudo, unlike a 26.04 install's sudo-rs.
      - name: Show the sudo and coreutils versions (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo --version | sed -n 1p
          stat --version | sed -n 1p

      - *check-not-root

      - if: matrix.parse
        run: just parse

      - run: just test
        env:
          TEST_FAIL_ON_SKIP: 1
          TEST_SHARD: ${{ matrix.shard }}

  # The one required check: lint and test pass, or the gate or a schedule run skipped them.
  checks:
    needs: [gate, lint, test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the gate, lint, and test results
        env:
          GATE: ${{ needs.gate.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "gate: $GATE, lint: $LINT, test: $TEST"
          [ "$GATE" == success ]
          for result in "$LINT" "$TEST"; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done

  brew-packages:
    needs: [gate, changes]
    if: needs.gate.outputs.tested != 'true' && needs.changes.outputs.brew == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install jq
      - run: bash scripts/check-brew-packages.sh

  # Unpinned on purpose, so a release that renames or rejects a setting fails here.
  ai-settings:
    needs: [gate, changes]
    if: needs.gate.outputs.tested != 'true' && needs.changes.outputs.ai == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bubblewrap

      - *install-yq

      - name: Let bwrap create user namespaces (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ "$(cat "$f" 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / true

      # Download first, so a truncated download can't run part of the script
      - name: Install the latest Claude Code and Codex
        run: |
          f="$RUNNER_TEMP/claude-install.sh"
          curl -fsSL -o "$f" https://claude.ai/install.sh
          bash "$f"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @openai/codex@latest

      - run: bash scripts/check-ai-settings.sh < /dev/null

      # The schema is platform-independent, so check it once, even if the CLI check fails.
      - if: runner.os == 'macOS' && (success() || failure())
        run: bash scripts/check-t3-settings.sh < /dev/null
        env:
          GITHUB_TOKEN: ${{ github.token }}
