# Fixed array indexes, so a reload (prefix+r) doesn't append copies. tmux's defaults use low ones.
set -s terminal-features[90] 'xterm-ghostty:RGB:extkeys'
set -s terminal-features[91] 'xterm-256color:RGB'
set -s terminal-features[92] 'tmux-256color:RGB'

set -s terminal-overrides[92] '*:Smulx=\E[4::%p1%dm'
set -s terminal-overrides[93] '*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g extended-keys on

# Not 0: an escape sequence split across reads would read as a lone Escape
set -sg escape-time 10

set -g history-limit 50000

set -g display-time 4000

set -g status-interval 15

# For vim autoread
set -g focus-events on

setw -g aggressive-resize on

set -g renumber-windows on

set -g detach-on-destroy off

set -g mouse on

setw -g mode-keys vi

set -g status-keys emacs

set -g set-titles on
set -g set-titles-string "#T"

# on, not external, so a nested tmux (Ubuntu's over SSH) can copy
set -g set-clipboard on
# all, not on, so hidden panes' OSC 9 notifications get through. Risk: any pane's output can set
# the clipboard, so check what you paste after an agent reads untrusted code.
set -g allow-passthrough all

# zsh/hooks.zsh exports these in panes
set -g update-environment[90] TERM_PROGRAM
set -g update-environment[91] TERM_PROGRAM_VERSION
# The ubuntu step reads it to prove a key login before turning off password logins
set -g update-environment[92] SSH_USER_AUTH
# Marker zsh/hooks.zsh checks to reread the environment only after an attach. The PID differs
# per event, unlike a timestamp.
%hidden ATTACH_MARKER="run-shell -b 'echo \$\$ > #{q:socket_path}.attached'"
set-hook -g client-attached[90] "$ATTACH_MARKER"
set-hook -g client-session-changed[90] "$ATTACH_MARKER"

set -g repeat-time 600

setw -g monitor-activity on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -gF @tmux_conf '#{current_file}'
bind r source-file -F '#{@tmux_conf}' \; display-message "Config reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h previous-window
bind -r C-l next-window

bind > swap-pane -D
bind < swap-pane -U

bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
# tmux-yank binds y

bind S command-prompt -p "New session:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
# -EE keeps the popup open on failure, to show the error
bind f display-popup -EE -w 80% -h 60% "~/.local/bin/tmux-sessionizer"

set -g status-style "bg=#222222,fg=#aaaaaa"
set -g status-left-length 50
set -g status-right-length 50
set -g status-left " #[fg=blue,bold]#S #[fg=default,nobold]| "
set -g status-right " %Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=blue,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=blue"

set -g message-style "bg=default,fg=yellow"

# Pinned in tmux/plugins.lock, in this order. Update with just bump-plugins, not prefix+U.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'

# Keeps prefix+C-l as next-window
set -g @vim_navigator_prefix_mapping_clear_screen 'C-k'

# Ubuntu over SSH has no clipboard tool, so copy through OSC 52 alone. Boot start on macOS would
# open a terminal window at login.
if-shell '[ "$(uname)" != Darwin ]' "set -g @override_copy_command 'cat > /dev/null' ; set -g @continuum-boot 'on'"

set -g @continuum-restore 'on'

# Otherwise tpm looks beside the config, in ~/.config/tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Must be last
run '~/.tmux/plugins/tpm/tpm'
