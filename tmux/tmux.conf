# ─── General ───

# Array options below take fixed indexes, so reloading this file (prefix+r) sets the same entries
# again instead of appending copies. tmux's defaults use the low indexes.

# Put Homebrew on Linux on PATH for panes and run jobs (tpm, plugins, prefix+f's fzf). A server
# started at boot by continuum's systemd unit lacks it unless the ubuntu step's environment.d file
# is in place. Skipped when PATH already has it, so a reload doesn't add it again.
if-shell '[ -d /home/linuxbrew/.linuxbrew/bin ] && case ":$PATH:" in *:/home/linuxbrew/.linuxbrew/bin:*) false ;; esac' \
  'set-environment -g PATH "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"'

# True color for Ghostty and other modern terminals, and for tmux nested in a pane (over SSH, say),
# whose TERM is tmux-256color. Extended keys for Ghostty's modifier keys.
set -s terminal-features[90] 'xterm-ghostty:RGB:extkeys'
set -s terminal-features[91] 'xterm-256color:RGB'
set -s terminal-features[92] 'tmux-256color:RGB'

# Undercurl and colored underlines
set -s terminal-overrides[92] '*:Smulx=\E[4::%p1%dm'
set -s terminal-overrides[93] '*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g extended-keys on

# Short delay after Escape, so vim gets it at once but escape sequences split across reads
# aren't taken for a lone Escape
set -sg escape-time 10

set -g history-limit 50000

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 15 seconds. Nothing in it changes faster than the clock's minute.
set -g status-interval 15

# Focus events (needed for vim autoread)
set -g focus-events on

# Aggressive resize (useful for multi-monitor)
setw -g aggressive-resize on

# Renumber windows when one is closed
set -g renumber-windows on

# Killing the attached session switches to another one instead of detaching, while one is left
set -g detach-on-destroy off

# Enable mouse (scrolling, selecting panes, resizing)
set -g mouse on

# Vi key bindings in copy mode
setw -g mode-keys vi

# Emacs key bindings in command prompt
set -g status-keys emacs

set -g set-titles on
set -g set-titles-string "#T"

# Clipboard integration via OSC 52 (critical for Ghostty)
set -g set-clipboard on
# Pass wrapped escape sequences, such as OSC 9 notifications, through to Ghostty. all, not on,
# which drops them from panes you can't see, such as an agent's in another window.
set -g allow-passthrough all

# Copy the outer terminal's identity into the session on every attach, so tools inside tmux
# can detect the real terminal (e.g. for desktop notifications). zsh exports it in panes.
set -g update-environment[90] TERM_PROGRAM
set -g update-environment[91] TERM_PROGRAM_VERSION
# The file where sshd recorded the SSH login's keys, which the ubuntu step reads to prove a key
# login before it turns off password logins
set -g update-environment[92] SSH_USER_AUTH
# Write a marker next to the socket on attach and on switching sessions, which also updates the
# environment, so zsh rereads it only then and not before every command. Each write holds the
# PID of run-shell's shell, which differs per event, so two events in one second still differ.
set-hook -g client-attached[90] "run-shell -b 'echo \$\$ > #{q:socket_path}.attached'"
set-hook -g client-session-changed[90] "run-shell -b 'echo \$\$ > #{q:socket_path}.attached'"

set -g repeat-time 600

# Activity monitoring (highlight in status bar only)
setw -g monitor-activity on

# ─── Prefix key ───

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Keybindings ───

# Reload config from wherever tmux loaded it (~/.config/tmux or $XDG_CONFIG_HOME/tmux)
set -gF @tmux_conf '#{current_file}'
bind r source-file -F '#{@tmux_conf}' \; display-message "Config reloaded!"

# Pane splitting (intuitive keys, open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (vim-style, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Copy mode
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
# tmux-yank binds y

# Session management
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
# Pick a project in ~/Dev and switch to its session. Replaces the default prefix+f (find-window).
# -EE closes the popup only when tmux-sessionizer succeeds, so its errors stay on screen.
bind f display-popup -EE -w 80% -h 60% "~/.local/bin/tmux-sessionizer"

# ─── Status bar ───

set -g status-style "bg=#222222,fg=#aaaaaa"
set -g status-left-length 50
set -g status-right-length 50
set -g status-left " #[fg=blue,bold]#S #[fg=default,nobold]| "
set -g status-right " %Y-%m-%d %H:%M "

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=blue,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=blue"

# Message style
set -g message-style "bg=default,fg=yellow"

# ─── Plugins (via tpm) ───

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'

# vim-tmux-navigator takes C-l in panes and, by default, binds prefix+C-l to clear the screen,
# replacing next-window above. Clear the screen with prefix+C-k instead.
set -g @vim_navigator_prefix_mapping_clear_screen 'C-k'

# tmux-yank pipes copies to pbcopy on macOS. Ubuntu over SSH has no clipboard tool to pipe to,
# and tmux-yank would show an error on every copy, so copy through OSC 52 (set-clipboard above)
# alone, which reaches the Mac's clipboard through Ghostty.
if-shell '[ "$(uname)" != Darwin ]' "set -g @override_copy_command 'cat > /dev/null'"

# Auto-restore sessions
set -g @continuum-restore 'on'
# On Ubuntu, start tmux at boot, which restores the sessions there: continuum adds a systemd user
# unit, which starts without a login under linger (the ubuntu step). On macOS it would open a
# terminal window at login instead.
if-shell '[ "$(uname)" != Darwin ]' "set -g @continuum-boot 'on'"

# Keep plugins next to tpm. With the config in ~/.config/tmux, tpm would otherwise look for them
# in ~/.config/tmux/plugins (or $XDG_CONFIG_HOME/tmux/plugins).
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize tpm (must be the last line)
run '~/.tmux/plugins/tpm/tpm'
