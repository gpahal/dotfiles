# From the dotfiles ubuntu step: ~/.local/bin, where t3, claude, codex, and git-wt live, then the
# dirs `cargo install` and `go install` put tools in, then Homebrew, on PATH for systemd user
# services, such as tmux at boot and the T3 Code server and its agents. The same order as zsh's.
# Named to sort after Ubuntu's 99-environment.conf, which sets PATH.
PATH=${HOME}/.local/bin:${HOME}/.cargo/bin:${HOME}/go/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:${PATH}
