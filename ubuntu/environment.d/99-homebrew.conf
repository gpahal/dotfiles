# From the dotfiles ubuntu step: Homebrew, and the dirs `cargo install` and `go install` put tools
# in, on PATH for systemd user services, such as tmux at boot and the T3 Code server and its
# agents. Named to sort after Ubuntu's 99-environment.conf, which sets PATH.
PATH=${HOME}/.cargo/bin:${HOME}/go/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:${PATH}
