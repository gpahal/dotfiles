add_newline = true
# The 500 ms default times out git status in large repos or under load
command_timeout = 2500

[username]
show_always = false

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[cmd_duration]
min_time = 10_000

[memory_usage]
threshold = 90
style = "bold dimmed white"
disabled = false
